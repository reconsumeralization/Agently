name: Landlock provider

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/landlock-provider.yml"
      - "agently/builtins/plugins/ExecutionResourceProvider/LandlockExecutionHelper.py"
      - "agently/builtins/plugins/ExecutionResourceProvider/LandlockExecutionResourceProvider.py"
      - "agently/core/operation/Action/ActionResourceRegistrar.py"
      - "tests/test_landlock_isolation.py"
      - "tests/test_landlock_execution_provider_integration.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  landlock-mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Show kernel used for Landlock evidence
        run: uname -a

      - name: Install Agently test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-asyncio

      - name: Run deterministic and observed Landlock tests
        run: |
          python -W error::RuntimeWarning -m pytest tests/test_landlock_isolation.py -q
          python -m pytest tests/test_landlock_execution_provider_integration.py -q -rs
