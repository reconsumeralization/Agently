name: Changed Python quality

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Ruff
        run: python -m pip install "ruff==0.16.5"
      - name: Check changed Python files
        run: >-
          python scripts/check_changed_python_quality.py
          --base "${{ github.event.pull_request.base.sha }}"
